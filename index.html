<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機台 SOP 系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#e8eaf0;--text2:#8b92a8;--text3:#555e74;--blue:#4a9eff;--green:#3ecf8e;--amber:#f5a623;--red:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;background:rgba(15,17,23,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;}
.logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:0.1em;white-space:nowrap;}
.logo span{color:var(--blue);}
.search-wrap{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;transition:border-color .2s;}
.search-wrap:focus-within{border-color:var(--blue);}
.search-wrap input{border:none;background:transparent;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text);outline:none;width:100%;}
.search-wrap input::placeholder{color:var(--text3);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.back-btn{display:none;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:7px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
.back-btn:hover{border-color:var(--blue);color:var(--blue);}
.back-btn.show{display:flex;}
.cur-label{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}

#home{padding:72px 24px 40px;max-width:1080px;margin:0 auto;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin-bottom:10px;}
.h-title{font-size:28px;font-weight:700;margin-bottom:8px;}
.h-sub{font-size:14px;color:var(--text2);margin-bottom:40px;line-height:1.7;}

#search-panel{display:none;margin-bottom:28px;}
#search-panel h3{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
.s-hit{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.s-hit:hover{border-color:var(--blue);}
.s-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.sb-blue{background:rgba(74,158,255,.12);color:var(--blue);}
.sb-green{background:rgba(62,207,142,.12);color:var(--green);}
.sb-amber{background:rgba(245,166,35,.12);color:var(--amber);}
.s-hit-text{font-size:13px;color:var(--text);}
.s-hit-text mark{background:rgba(245,166,35,.25);color:var(--amber);border-radius:2px;}
.s-hit-sub{font-size:11px;color:var(--text3);}

.sec-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);}
.card:hover::before{opacity:1;}
.c-blue::before{background:var(--blue);}
.c-green::before{background:var(--green);}
.c-amber::before{background:var(--amber);}
.card-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:12px;}
.ci-blue{background:rgba(74,158,255,.12);}
.ci-green{background:rgba(62,207,142,.12);}
.ci-amber{background:rgba(245,166,35,.12);}
.card-cust{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px;}
.card-foot{display:flex;align-items:center;gap:6px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
.t-blue{background:rgba(74,158,255,.12);color:var(--blue);}
.t-green{background:rgba(62,207,142,.12);color:var(--green);}
.t-amber{background:rgba(245,166,35,.12);color:var(--amber);}
.t-gray{background:rgba(255,255,255,.06);color:var(--text3);}
.card-arr{margin-left:auto;color:var(--text3);font-size:15px;transition:all .2s;}
.card:hover .card-arr{transform:translateX(3px);color:var(--text2);}
.add-card{border:1px dashed var(--border2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;gap:8px;color:var(--text3);cursor:default;border-radius:12px;opacity:.5;}

#viewer{display:none;padding-top:52px;height:100vh;}
.v-layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 52px);}
.v-sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.v-sidebar-head{padding:14px;border-bottom:1px solid var(--border);}
.v-mname{font-size:13px;font-weight:700;margin-bottom:2px;}
.v-msub{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.v-nav{flex:1;overflow-y:auto;padding:6px 0;}
.v-nav::-webkit-scrollbar{width:3px;}
.v-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.nav-sec{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px 3px;}
.nav-it{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;transition:background .1s;}
.nav-it:hover{background:rgba(255,255,255,.04);}
.nav-it.act-blue{background:rgba(74,158,255,.1);}
.nav-it.act-green{background:rgba(62,207,142,.1);}
.nav-it.act-amber{background:rgba(245,166,35,.1);}
.n-num{width:18px;height:18px;border-radius:4px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;flex-shrink:0;transition:all .15s;}
.act-blue .n-num{background:var(--blue);border-color:var(--blue);color:#fff;}
.act-green .n-num{background:var(--green);border-color:var(--green);color:#fff;}
.act-amber .n-num{background:var(--amber);border-color:var(--amber);color:#fff;}
.n-lbl{font-size:11px;color:var(--text2);line-height:1.3;}
.act-blue .n-lbl{color:var(--blue);font-weight:500;}
.act-green .n-lbl{color:var(--green);font-weight:500;}
.act-amber .n-lbl{color:var(--amber);font-weight:500;}

.v-main{display:flex;flex-direction:column;background:#12121e;overflow:hidden;}
.v-toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.pg-nav{display:flex;align-items:center;gap:6px;}
.nb{width:28px;height:28px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.nb:hover:not(:disabled){border-color:var(--blue);color:var(--blue);}
.nb:disabled{opacity:.3;cursor:not-allowed;}
.pg-ind{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);min-width:60px;text-align:center;}
.zoom-c{display:flex;align-items:center;gap:6px;margin-left:auto;}
.zb{width:26px;height:26px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.zb:hover{border-color:var(--blue);color:var(--blue);}
.z-lbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);min-width:40px;text-align:center;}
.fit-b{padding:0 10px;height:26px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;transition:all .15s;white-space:nowrap;font-family:'Noto Sans TC',sans-serif;}
.fit-b:hover{border-color:var(--blue);color:var(--blue);}

.pdf-area{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px;position:relative;}
.pdf-area::-webkit-scrollbar{width:6px;height:6px;}
.pdf-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
#pdf-canvas{border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.7);display:block;}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px;}
.overlay.hidden{display:none;}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ov-icon{font-size:36px;opacity:.35;}
.ov-title{font-size:15px;font-weight:500;color:var(--text);}
.ov-desc{font-size:13px;color:var(--text2);max-width:360px;line-height:1.7;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">SOP<span>.</span>SYS</div>
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="搜尋機種、型號、關鍵字...">
  </div>
  <div class="topbar-right">
    <span class="cur-label" id="cur-label"></span>
    <button class="back-btn" id="back-btn" onclick="goHome()">← 返回列表</button>
  </div>
</div>

<div id="home">
  <div class="eyebrow">機台測試 SOP 管理系統</div>
  <div class="h-title">選擇機種，開始測試</div>
  <div class="h-sub">點選機種卡片即可開啟完整手冊，含原始圖片。</div>
  <div id="search-panel"><h3 id="s-count"></h3><div id="s-list"></div></div>
  <div id="grid-wrap">
    <div class="sec-label">已建立機種</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="viewer">
  <div class="v-layout">
    <div class="v-sidebar">
      <div class="v-sidebar-head">
        <div class="v-mname" id="v-mname"></div>
        <div class="v-msub" id="v-msub"></div>
      </div>
      <div class="v-nav" id="v-nav"></div>
    </div>
    <div class="v-main">
      <div class="v-toolbar">
        <div class="pg-nav">
          <button class="nb" id="prev-btn" onclick="prevPage()">‹</button>
          <span class="pg-ind" id="pg-ind">— / —</span>
          <button class="nb" id="next-btn" onclick="nextPage()">›</button>
        </div>
        <div class="zoom-c">
          <button class="zb" onclick="zoomOut()">−</button>
          <span class="z-lbl" id="z-lbl">100%</span>
          <button class="zb" onclick="zoomIn()">+</button>
          <button class="fit-b" onclick="fitPage()">符合頁面</button>
        </div>
      </div>
      <div class="pdf-area" id="pdf-area">
        <div class="overlay" id="overlay">
          <div class="spinner" id="ov-spinner"></div>
          <div class="ov-icon hidden" id="ov-icon"></div>
          <div class="ov-title" id="ov-title">載入中...</div>
          <div class="ov-desc" id="ov-desc"></div>
        </div>
        <canvas id="pdf-canvas" style="display:none"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    ]
  }
];

}
let cur = null, pdfDoc = null, curPage = 1, totalPages = 0, scale = 1.2, renderTask = null;

// ── UI helpers ──
function showOverlay(spinner, icon, title, desc) {
  document.getElementById('ov-spinner').style.display = spinner ? 'block' : 'none';
  const iconEl = document.getElementById('ov-icon');
  iconEl.classList.toggle('hidden', spinner);
  iconEl.textContent = icon || '';
  document.getElementById('ov-title').textContent = title || '';
  document.getElementById('ov-desc').textContent = desc || '';
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('pdf-canvas').style.display = 'none';
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pdf-canvas').style.display = 'block';
}

// ── Grid ──
function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  MACHINES.forEach(m => {
    const d = document.createElement('div');
    d.className = `card c-${m.color}`;
    d.innerHTML = `
      <div class="card-icon ci-${m.color}">${m.icon}</div>
      <div class="card-cust">${m.customer}</div>
      <div class="card-title">${m.title}</div>
      <div class="card-desc">${m.desc}</div>
      <div class="card-foot">
        ${m.tags.map(t => `<span class="tag t-${m.color}">${t}</span>`).join('')}
        <span class="tag t-gray">${m.slides}頁</span>
        <span class="card-arr">→</span>
      </div>`;
    d.onclick = () => openMachine(m);
    g.appendChild(d);
  });
  const add = document.createElement('div');
  add.className = 'add-card';
  add.innerHTML = '<div style="font-size:20px">＋</div><div style="font-size:12px">新增機種</div>';
  g.appendChild(add);
}

// ── Open machine ──
async function openMachine(m) {
  cur = m;
  document.getElementById('home').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('cur-label').textContent = m.title;
  document.getElementById('v-mname').textContent = m.title;
  document.getElementById('v-msub').textContent = m.subtitle;
  renderNav(m);
  showOverlay(true, '', '載入手冊中...');
  try {
    const resp = await fetch(m.pdf);
    if (!resp.ok) throw new Error('fetch failed');
    const buf = await resp.arrayBuffer();
    await initPDF(new Uint8Array(buf));
  } catch(e) {
    showOverlay(false, '⚠', '載入失敗', '無法讀取 PDF，請確認網路連線後重新整理。');
  }
}

async function initPDF(data) {
  try {
    pdfDoc = await pdfjsLib.getDocument({ data }).promise;
    totalPages = pdfDoc.numPages;
    curPage = 1;
    hideOverlay();
    await renderPage(curPage);
    fitPage();
  } catch(e) {
    showOverlay(false, '⚠', 'PDF 解析失敗', '檔案可能損毀，請聯繫管理員。');
  }
}

// ── Nav ──
function renderNav(m) {
  const nav = document.getElementById('v-nav');
  nav.innerHTML = '';
  let n = 1;
  m.toc.forEach(sec => {
    const sl = document.createElement('div');
    sl.className = 'nav-sec';
    sl.textContent = sec.s;
    nav.appendChild(sl);
    sec.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'nav-it';
      el.dataset.page = n;
      el.innerHTML = `<div class="n-num">${n}</div><div class="n-lbl">${item}</div>`;
      el.onclick = () => jumpTo(parseInt(el.dataset.page));
      nav.appendChild(el);
      n++;
    });
  });
}

function updateNav(page) {
  const c = cur ? cur.color : 'blue';
  document.querySelectorAll('.nav-it').forEach(el => {
    el.classList.remove('act-blue', 'act-green', 'act-amber');
    if (parseInt(el.dataset.page) === page) el.classList.add(`act-${c}`);
  });
  const active = document.querySelector('.act-blue, .act-green, .act-amber');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ── PDF render ──
async function renderPage(n) {
  if (!pdfDoc) return;
  if (renderTask) { try { renderTask.cancel(); } catch(e) {} }
  const page = await pdfDoc.getPage(n);
  const vp = page.getViewport({ scale });
  const canvas = document.getElementById('pdf-canvas');
  canvas.width = vp.width;
  canvas.height = vp.height;
  renderTask = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
  try { await renderTask.promise; } catch(e) {}
  document.getElementById('pg-ind').textContent = `${n} / ${totalPages}`;
  document.getElementById('prev-btn').disabled = n <= 1;
  document.getElementById('next-btn').disabled = n >= totalPages;
  document.getElementById('z-lbl').textContent = Math.round(scale * 100) + '%';
  updateNav(n);
}

async function prevPage() { if (curPage > 1) { curPage--; await renderPage(curPage); } }
async function nextPage() { if (curPage < totalPages) { curPage++; await renderPage(curPage); } }
async function jumpTo(n) { if (n >= 1 && n <= totalPages) { curPage = n; await renderPage(curPage); } }
function zoomIn() { scale = Math.min(scale + 0.2, 3); renderPage(curPage); }
function zoomOut() { scale = Math.max(scale - 0.2, 0.4); renderPage(curPage); }
function fitPage() {
  if (!pdfDoc) return;
  pdfDoc.getPage(curPage).then(page => {
    const area = document.getElementById('pdf-area');
    const vp = page.getViewport({ scale: 1 });
    scale = (area.clientWidth - 36) / vp.width;
    renderPage(curPage);
  });
}

// ── Search ──
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const sp = document.getElementById('search-panel');
  const gw = document.getElementById('grid-wrap');
  if (!q) { sp.style.display = 'none'; gw.style.display = 'block'; return; }
  const hits = [];
  MACHINES.forEach(m => {
    if ([m.customer, m.title, m.subtitle, ...m.tags].some(f => f.toLowerCase().includes(q)))
      hits.push({ m, text: `${m.customer} ${m.title}`, sub: m.desc });
    m.toc.forEach(sec => sec.items.forEach(item => {
      if (item.toLowerCase().includes(q) || sec.s.toLowerCase().includes(q))
        hits.push({ m, text: item, sub: `${m.title} › ${sec.s}` });
    }));
  });
  const hl = t => t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), x => `<mark>${x}</mark>`);
  document.getElementById('s-count').textContent = `找到 ${hits.length} 個結果`;
  document.getElementById('s-list').innerHTML = hits.slice(0, 20).map(h => `
    <div class="s-hit" onclick="openMachine(MACHINES.find(x=>x.id==='${h.m.id}'))">
      <span class="s-badge sb-${h.m.color}">${h.m.title}</span>
      <div>
        <div class="s-hit-text">${hl(h.text)}</div>
        <div class="s-hit-sub">${h.sub}</div>
      </div>
    </div>`).join('');
  sp.style.display = 'block';
  gw.style.display = hits.length ? 'none' : 'block';
});

function goHome() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('cur-label').textContent = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-panel').style.display = 'none';
  document.getElementById('grid-wrap').style.display = 'block';
  pdfDoc = null; cur = null;
}

document.addEventListener('keydown', e => {
  if (document.getElementById('viewer').style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
  if (e.key === 'Escape') goHome();
});

renderGrid();
</script>
