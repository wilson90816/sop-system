<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOP 系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header span.badge {
      background: #e94560;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* 側邊欄 */
    .sidebar {
      width: 280px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #f0f0f0;
    }

    .sop-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .sop-list li {
      border-bottom: 1px solid #f5f5f5;
    }

    .sop-list li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      text-decoration: none;
      color: #333;
      font-size: 0.9rem;
      transition: background 0.15s;
      cursor: pointer;
    }

    .sop-list li a:hover {
      background: #f0f4ff;
      color: #1a1a2e;
    }

    .sop-list li a.active {
      background: #eef1fb;
      color: #1a1a2e;
      font-weight: 600;
      border-left: 3px solid #e94560;
    }

    .sop-list li a .icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .sop-list li a .name {
      flex: 1;
      line-height: 1.3;
    }

    /* 主內容區 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar .doc-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .toolbar .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      color: white;
      padding: 7px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .toolbar .btn:hover {
      background: #e94560;
    }

    .pdf-container {
      flex: 1;
      background: #525659;
      overflow: hidden;
    }

    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      gap: 12px;
    }

    .placeholder .big-icon {
      font-size: 4rem;
    }

    .placeholder p {
      font-size: 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>📋 SOP 系統</h1>
  <span class="badge">INTERNAL</span>
</header>

<div class="layout">

  <!-- 側邊欄：SOP 清單 -->
  <aside class="sidebar">
    <div class="sidebar-header">SOP 文件清單</div>
    <ul class="sop-list" id="sopList">
      <li>
        <a href="#" class="active" onclick="openPDF(this, 'sop-files/NTC OHBN2 Operation Guide.pdf', 'NTC OHBN2 Operation Guide')">
          <span class="icon">📄</span>
          <span class="name">NTC OHBN2 Operation Guide</span>
        </a>
      </li>
      <!-- 之後新增 SOP 在這裡加 <li> -->
    </ul>
  </aside>

  <!-- 主內容區 -->
  <main class="main">
    <div class="toolbar">
      <span class="doc-title" id="docTitle">NTC OHBN2 Operation Guide</span>
      <a href="#" class="btn" id="downloadBtn" download>
        ⬇ 下載 PDF
      </a>
    </div>
    <div class="pdf-container">
      <iframe id="pdfViewer"
        src="sop-files/NTC%20OHBN2%20Operation%20Guide.pdf"
        title="PDF Viewer">
      </iframe>
    </div>
  </main>

</div>

<script>
  function openPDF(el, pdfPath, title) {
    // 移除所有 active
    document.querySelectorAll('.sop-list a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');

    // 更新標題
    document.getElementById('docTitle').textContent = title;

    // 更新 iframe
    const encoded = pdfPath.split('/').map(p => encodeURIComponent(p)).join('/');
    document.getElementById('pdfViewer').src = encoded;

    // 更新下載按鈕
    document.getElementById('downloadBtn').href = encoded;

    return false;
  }
</script>

</body>
</html>
